[project]
name = "codecopilot"
version = "0.5.0"
description = "Codebase Intelligence Copilot — grounded Q&A over a repository with path:line citations"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "sentence-transformers>=3.0",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codecopilot = "codecopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["codecopilot"]

[tool.setuptools.package-data]
codecopilot = ["prompts/*.md", "static/*"]
